name: build_and_publish_images.yaml

on:
  workflow_call:
    inputs:
      version:
        description: 'Primary OCI tag and image version label.'
        required: true
        type: 'string'
      additional_version:
        description: 'Optional second OCI tag for the same image manifest.'
        required: false
        default: ''
        type: 'string'
      push:
        description: 'Whether the built images are pushed to GHCR.'
        required: false
        default: false
        type: 'boolean'

permissions: { }

env:
  REGISTRY: 'ghcr.io'

jobs:
  build:
    name: 'Build ${{ matrix.service }} image'
    runs-on: 'ubuntu-26.04'
    permissions:
      contents: 'read'
      packages: 'write'
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: 'server'
            context: './server'
            dockerfile: './server/Dockerfile'
          - service: 'web'
            context: './clients'
            dockerfile: './clients/web/Dockerfile'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v7.0.1'

      - name: 'Set up Docker Buildx'
        uses: 'docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435'

      - name: 'Log in to GitHub Container Registry'
        if: "${{ inputs.push }}"
        uses: 'docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1'
        with:
          registry: '${{ env.REGISTRY }}'
          username: '${{ github.actor }}'
          password: '${{ secrets.GITHUB_TOKEN }}'

      - name: 'Generate image metadata'
        id: 'metadata'
        uses: 'docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7'
        with:
          images: '${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.service }}'
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=${{ inputs.additional_version }},enable=${{ inputs.additional_version != '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}

      - name: 'Build and optionally push image'
        uses: 'docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83'
        with:
          context: '${{ matrix.context }}'
          file: '${{ matrix.dockerfile }}'
          platforms: 'linux/amd64'
          push: '${{ inputs.push }}'
          build-args: |
            VERSION=${{ inputs.version }}
          tags: '${{ steps.metadata.outputs.tags }}'
          labels: '${{ steps.metadata.outputs.labels }}'
          cache-from: 'type=gha,scope=${{ matrix.service }}'
          cache-to: 'type=gha,mode=max,scope=${{ matrix.service }}'
          provenance: 'mode=max'
          sbom: '${{ inputs.push }}'
